<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games Planet Invoice Builder</title>
<style>
:root{--navy:#071426;--blue:#087cf0;--cyan:#19c7e8;--line:#dbe4ef;--muted:#637083;--green:#0d9e59}
*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#132033;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.page{max-width:1320px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.top h1{margin:0;color:var(--navy);font-size:clamp(24px,4vw,38px)}.back{color:#fff;background:var(--navy);padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:700}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px}.panel,.invoice{background:#fff;border-radius:18px;box-shadow:0 10px 32px #152a4520}.panel{padding:18px;align-self:start;position:sticky;top:12px}.panel h2{margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px;color:#35445a}.field input,.field textarea,.field select{width:100%;border:1px solid #cdd8e5;border-radius:9px;padding:10px 11px;font:inherit;background:white}.field textarea{min-height:68px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{display:flex;gap:9px;align-items:center;margin:11px 0;padding:10px;background:#f5f8fc;border-radius:10px}.switch input{width:18px;height:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.actions button{border:0;border-radius:10px;padding:11px 8px;font-weight:800;cursor:pointer;background:#e7eef8;color:#10233d}.actions .primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.actions .wa{background:#14a965;color:#fff}.invoice{padding:clamp(18px,4vw,42px);min-width:0}.inv-head{display:flex;justify-content:space-between;gap:22px;border-bottom:3px solid var(--navy);padding-bottom:18px}.brand h2{font-size:32px;margin:0;color:var(--navy)}.brand p,.meta p{margin:3px 0}.meta{text-align:right}.badge{display:inline-block;background:var(--navy);color:#fff;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:800}.customer{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0;padding:16px;background:#f7f9fc;border-radius:12px}.customer h3{margin:0 0 7px}.customer p{white-space:pre-line;margin:2px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{background:var(--navy);color:#fff;text-align:left;padding:11px}td{padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.summary{width:min(100%,440px);margin:18px 0 0 auto}.sum-row{display:flex;justify-content:space-between;gap:20px;padding:7px 4px}.sum-row.total{font-size:22px;font-weight:900;border-top:2px solid var(--navy);margin-top:5px;padding-top:12px;color:var(--navy)}.note{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted)}.empty{padding:40px;text-align:center;color:#b42318;background:#fff4f2;border-radius:12px}.loading{position:fixed;inset:0;background:#061323cc;color:white;display:none;place-items:center;z-index:20;font-size:20px;font-weight:800}.loading.show{display:grid}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}.customer{grid-template-columns:1fr}.inv-head{flex-direction:column}.meta{text-align:left}}@media(max-width:520px){.page{padding:10px}.two,.actions{grid-template-columns:1fr}.invoice{padding:15px}.top{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff}.page{max-width:none;padding:0}.top,.panel{display:none!important}.layout{display:block}.invoice{box-shadow:none;border-radius:0;padding:0}.customer{break-inside:avoid}button{display:none!important}}
 .invoice.a4-full{width:210mm;max-width:100%;min-height:277mm}.invoice.a4-half{width:210mm;max-width:100%;min-height:138mm;padding:8mm;font-size:12px}.invoice.a4-quarter{width:105mm;max-width:100%;min-height:138mm;padding:5mm;font-size:10px}.invoice.a4-half .brand h2{font-size:23px}.invoice.a4-quarter .brand h2{font-size:18px}.invoice.a4-half .customer,.invoice.a4-quarter .customer{margin:10px 0;padding:8px;gap:8px}.invoice.a4-half th,.invoice.a4-half td{padding:6px}.invoice.a4-quarter .inv-head{display:block;padding-bottom:8px}.invoice.a4-quarter .meta{text-align:left;margin-top:6px}.invoice.a4-quarter table{min-width:0;font-size:8px}.invoice.a4-quarter th,.invoice.a4-quarter td{padding:3px 2px}.invoice.a4-quarter .summary{width:100%;margin-top:7px}.invoice.a4-quarter .sum-row{padding:2px 0}.invoice.a4-quarter .sum-row.total{font-size:14px;padding-top:5px}.invoice.density-compact{font-size:12px}.invoice.density-compact th,.invoice.density-compact td{padding:6px}.invoice.density-tight{font-size:10px}.invoice.density-tight th,.invoice.density-tight td{padding:3px}.invoice.receipt-58{width:58mm;max-width:58mm;padding:3mm;font-size:8px;border-radius:0}.invoice.receipt-58 .inv-head{display:block;padding-bottom:6px}.invoice.receipt-58 .brand h2{font-size:15px}.invoice.receipt-58 .meta{text-align:left;margin-top:5px}.invoice.receipt-58 .customer{display:block;margin:6px 0;padding:5px}.invoice.receipt-58 .customer>div:last-child{display:none}.invoice.receipt-58 table{min-width:0;font-size:7px}.invoice.receipt-58 th,.invoice.receipt-58 td{padding:3px 1px}.invoice.receipt-58 th:first-child,.invoice.receipt-58 td:first-child{display:none}.invoice.receipt-58 .summary{width:100%;margin-top:6px}.invoice.receipt-58 .sum-row{padding:2px 0}.invoice.receipt-58 .sum-row.total{font-size:12px;padding-top:5px}.invoice.receipt-58 .note{margin-top:7px;padding-top:5px}@media print{body.print-58 .invoice{width:58mm!important;max-width:58mm!important;padding:2mm!important;font-size:8px}body.print-58 .invoice table{min-width:0;font-size:7px}body.print-half .invoice{width:190mm!important;min-height:128mm!important;padding:6mm!important}body.print-quarter .invoice{width:95mm!important;min-height:128mm!important;padding:4mm!important}}
.preview-column{min-width:0}.preview-column>.actions{grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0 0}.courier-help{font-size:12px;color:var(--muted);margin-top:5px}.toplinks{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:520px){.preview-column>.actions{grid-template-columns:1fr 1fr}}@media print{.preview-column>.actions{display:none!important}}
</style>
<style id="printPageStyle">@page{size:A4 portrait;margin:10mm}</style>
</head>
<body>
<div class="loading" id="loading">Preparing invoice file…</div>
<div class="page">
  <div class="top"><div><h1>Invoice Builder</h1><div>Selected cart products are loaded automatically.</div></div><div class="toplinks"><a class="back" href="invoice-manager.html">Custom Invoice &amp; Records</a><a class="back" href="index.html">← Back to Products</a></div></div>
  <div class="layout">
    <aside class="panel">
      <h2>Invoice Settings</h2>
      <div class="two"><div class="field"><label>Invoice Number</label><input id="invoiceNo"></div><div class="field"><label>Invoice Date</label><input id="invoiceDate" type="date"></div></div>
      <div class="field"><label>Customer Name</label><input id="customerName" placeholder="Customer name"></div>
      <div class="field"><label>Mobile Number</label><input id="mobile" inputmode="numeric" placeholder="10-digit mobile"></div>
      <div class="field"><label>Billing Address</label><textarea id="address" placeholder="Full billing address"></textarea></div>
      <div class="field"><label>Invoice Type</label><select id="gstMode"><option value="no">Without GST Invoice</option><option value="yes">GST Invoice (18%)</option></select></div>
      <div class="field"><label>Invoice Layout / Autofit</label><select id="printFormat"><option value="a4-full">A4 — Full Page</option><option value="a4-half">A4 — Half Page</option><option value="a4-quarter">A4 — Quarter Page</option><option value="58">58mm Thermal Receipt</option></select></div>
      <div class="switch"><input type="checkbox" id="discountEnabled"><label for="discountEnabled"><b>Apply price adjustment</b><br><small>Show the reduced amount on invoice</small></label></div>
      <div class="two" id="discountFields"><div class="field"><label>Adjustment Type</label><select id="discountType"><option value="flat">Flat amount</option><option value="percent">Percentage</option></select></div><div class="field"><label>Value</label><input id="discountValue" type="number" min="0" value="0"></div></div>
      <div class="switch"><input type="checkbox" id="courierEnabled"><label for="courierEnabled"><b>Add courier charges</b></label></div>
      <div id="courierField"><div class="field"><label>Courier Service</label><select id="courierService"><option>Trackon.in</option><option>Shreemaruti.com</option><option>DTDC</option><option>Speed Post</option><option>Delhivery.com</option><option>BlueDart</option><option>Ecom Express</option><option>XpressBees</option></select></div><div class="field"><label>Courier Amount</label><input id="courierAmount" type="number" min="0" value="0"><div class="courier-help" id="courierHelp"></div></div></div>
      <div class="field"><label>Invoice Note</label><textarea id="invoiceNote">Thank you for shopping with Games Planet.</textarea></div>
    </aside>
    <div class="preview-column"><main class="invoice" id="invoicePaper"><div id="invoiceContent"></div></main><div class="actions"><button id="printBtn">Print</button><button id="pdfBtn">Download PDF</button><button id="jpgBtn">Download JPEG</button><button class="wa" id="waPdfBtn">WhatsApp PDF</button><button class="wa" id="waJpgBtn">WhatsApp JPEG</button></div></div>
  </div>
</div>
<script src="assets/html2canvas.min.js"></script>
<script src="assets/jspdf.umd.min.js"></script>
<script>
const GST_RATE=.18;
const seller={shopName:'Games Planet',firmName:'M/S GAMES PLANET ZONE',legalName:'RAJINDER SINGH',constitution:'Proprietorship',gstin:'09DIDPS5066Q1ZB',mobile:'7983624797',shopAddress:"Near JK's Tyre, Front of Raza Sugar Mill Gate, Radha Road to Gurudwara Road, Civil Lines, Rampur, U.P – 244901",gstAddress:'Shop No. 12, Water Works Compound, Radha Road, Civil Lines, Rampur, Uttar Pradesh – 244901'};
let order=readOrder();
function readOrder(){try{return JSON.parse(localStorage.getItem('gp_invoice_summary')||localStorage.getItem('gp_order_summary')||'null')}catch(e){return null}}
const $=id=>document.getElementById(id);
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function courierRate(name){return ['Trackon.in','Shreemaruti.com','DTDC'].includes(name)?100:200}
function chargeableKg(){return Math.max(1,Number(order?.chargeableKg)||Math.ceil(Number(order?.packedWeight||order?.totalWeight||0)/1000)||1)}
function setCourierAmount(){const kg=chargeableKg(),rate=courierRate($('courierService').value),amount=kg*rate;$('courierAmount').value=amount;$('courierHelp').textContent=`${kg} kg × ₹${rate}/kg = ₹${amount}`;render()}
function init(){const now=new Date(),mobile=matchMedia('(max-width:767px)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);$('invoiceDate').value=now.toISOString().slice(0,10);$('invoiceNo').value='GPZ-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(Date.now()).slice(-5);$('printFormat').value=mobile?'a4-quarter':'a4-full';['invoiceNo','invoiceDate','customerName','mobile','address','gstMode','printFormat','discountEnabled','discountType','discountValue','courierAmount','invoiceNote'].forEach(id=>$(id).addEventListener(id.includes('Enabled')||id==='gstMode'||id==='printFormat'||id==='discountType'?'change':'input',render));$('courierEnabled').addEventListener('change',()=>{$('courierEnabled').checked?setCourierAmount():render()});$('courierService').addEventListener('change',setCourierAmount);$('courierHelp').textContent=`${chargeableKg()} kg × ₹${courierRate($('courierService').value)}/kg`;render()}
function calc(){const subtotal=order?.items?.reduce((s,x)=>s+Number(x.lineTotal||0),0)||0;const listSubtotal=order?.items?.reduce((s,x)=>s+Number(x.baseUnitPrice??x.unitPrice??0)*Number(x.quantity||0),0)||0;const automaticSaving=Math.max(0,listSubtotal-subtotal);let adjustment=0;if($('discountEnabled').checked){const v=Math.max(0,Number($('discountValue').value)||0);adjustment=$('discountType').value==='percent'?subtotal*Math.min(v,100)/100:v;adjustment=Math.min(adjustment,subtotal)}const taxable=Math.max(0,subtotal-adjustment);const gst=$('gstMode').value==='yes'?taxable*GST_RATE:0;const courier=$('courierEnabled').checked?Math.max(0,Number($('courierAmount').value)||0):0;return{listSubtotal,subtotal,automaticSaving,adjustment,taxable,gst,courier,total:taxable+gst+courier}}
function render(){if(!order?.items?.length){$('invoiceContent').innerHTML='<div class="empty"><b>No products found.</b><br>Return to the products page, add items to cart and tap Create Invoice.</div>';return}const c=calc(),gstOn=$('gstMode').value==='yes',format=$('printFormat').value,paper=$('invoicePaper'),count=order.items.length;paper.className='invoice '+(format==='58'?'receipt-58':format)+(count>14?' density-tight':count>8?' density-compact':'');document.body.classList.toggle('print-58',format==='58');document.body.classList.toggle('print-half',format==='a4-half');document.body.classList.toggle('print-quarter',format==='a4-quarter');$('printPageStyle').textContent=format==='58'?'@page{size:58mm auto;margin:0}':'@page{size:A4 portrait;margin:8mm}';const sellerBlock=gstOn?`<h2>${seller.firmName}</h2><p><b>Legal Name:</b> ${seller.legalName}</p><p><b>Trade Name:</b> ${seller.firmName}</p><p><b>Constitution:</b> ${seller.constitution}</p><p><b>GSTIN:</b> ${seller.gstin}</p><p>${seller.gstAddress}</p><p>Mobile: ${seller.mobile}</p>`:`<h2>${seller.shopName}</h2><p>Gaming &amp; Arcade Accessories</p><p>${seller.shopAddress}</p><p>Mobile: ${seller.mobile}</p>`;const rows=order.items.map((x,i)=>{const q=Number(x.quantity||0),uw=Number(x.unitWeight||0),dims=Array.isArray(x.dimensions)&&x.dimensions.length?x.dimensions.join(' × ')+' cm':'—',bulk=Number(x.baseUnitPrice||x.unitPrice)!==Number(x.unitPrice);return `<tr><td>${i+1}</td><td><b>${safe(x.name)}</b><br><small>Size: ${safe(dims)}<br>Weight: ${uw} g × ${q} = ${uw*q} g${bulk?'<br><b>Automatic quantity price applied</b>':''}</small></td><td>${q}</td><td>${money(x.unitPrice)}</td><td>${money(x.lineTotal)}</td></tr>`}).join('');$('invoiceContent').innerHTML=`<div class="inv-head"><div class="brand">${sellerBlock}</div><div class="meta"><span class="badge">${gstOn?'TAX INVOICE':'INVOICE'}</span><p><b>Invoice:</b> ${safe($('invoiceNo').value)}</p><p><b>Date:</b> ${safe($('invoiceDate').value)}</p></div></div><section class="customer"><div><h3>Bill To</h3><p><b>${safe($('customerName').value||'Customer')}</b></p><p>${safe($('mobile').value)}</p><p>${safe($('address').value)}</p></div><div><h3>Order Information</h3><p>Total units: <b>${Number(order.totalQuantity||0)}</b></p><p>Products weight: <b>${Number(order.totalWeight||0)} g</b></p><p>Packed weight: <b>${Number(order.packedWeight||order.totalWeight||0)} g</b></p></div></section><div class="table-wrap"><table><thead><tr><th>#</th><th>Product / Size / Weight</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table></div><div class="summary">${c.automaticSaving?`<div class="sum-row"><span>Regular Products Value</span><b>${money(c.listSubtotal)}</b></div><div class="sum-row"><span>Automatic Quantity Discount</span><b>− ${money(c.automaticSaving)}</b></div>`:''}<div class="sum-row"><span>Products Subtotal</span><b>${money(c.subtotal)}</b></div>${$('discountEnabled').checked?`<div class="sum-row"><span>Additional Price Adjustment</span><b>− ${money(c.adjustment)}</b></div>`:''}${gstOn?`<div class="sum-row"><span>GST (18%)</span><b>${money(c.gst)}</b></div>`:''}${$('courierEnabled').checked?`<div class="sum-row"><span>Courier Charges</span><b>${money(c.courier)}</b></div>`:''}<div class="sum-row total"><span>Grand Total</span><span>${money(c.total)}</span></div></div><div class="note">${safe($('invoiceNote').value)}<br>${gstOn?'GST included as shown above.':'GST invoice not requested.'}</div>`}
async function canvas(){render();if(typeof window.html2canvas!=='function')throw new Error('Invoice image library load nahi hui. Page refresh karke dobara try karein.');$('loading').classList.add('show');try{return await window.html2canvas($('invoicePaper'),{scale:innerWidth<768?2:2.5,backgroundColor:'#ffffff',useCORS:true,allowTaint:false,logging:false,windowWidth:$('invoicePaper').scrollWidth})}finally{$('loading').classList.remove('show')}}
function filename(ext){return ($('invoiceNo').value||'games-planet-invoice').replace(/[^a-z0-9_-]/gi,'-')+'.'+ext}
async function jpegBlob(){const c=await canvas();return new Promise((resolve,reject)=>c.toBlob(b=>b&&b.size?resolve(b):reject(new Error('JPEG file create nahi hui.')),'image/jpeg',.94))}
async function pdfBlob(){const c=await canvas();if(!window.jspdf?.jsPDF)throw new Error('PDF library load nahi hui. Page refresh karke dobara try karein.');const {jsPDF}=window.jspdf,format=$('printFormat').value,img=c.toDataURL('image/jpeg',.94);let pdf;if(format==='58'){const width=58,height=Math.max(40,width*c.height/c.width);pdf=new jsPDF({orientation:'p',unit:'mm',format:[width,height],compress:true});pdf.addImage(img,'JPEG',0,0,width,height,undefined,'FAST')}else{pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});const box=format==='a4-quarter'?{x:10,y:10,w:95,h:128}:format==='a4-half'?{x:10,y:10,w:190,h:128}:{x:10,y:10,w:190,h:277},ratio=Math.min(box.w/c.width,box.h/c.height),w=c.width*ratio,h=c.height*ratio;pdf.addImage(img,'JPEG',box.x,box.y,w,h,undefined,'FAST')}const blob=pdf.output('blob');if(!blob?.size)throw new Error('PDF file create nahi hui.');return blob}
function download(blob,name){if(!blob?.size)throw new Error('Download file empty hai.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function shareFile(blob,name,type){if(!blob?.size)throw new Error('Share file empty hai.');const file=new File([blob],name,{type}),shareData={title:'Games Planet Invoice',text:'Invoice '+$('invoiceNo').value,files:[file]};try{const allowed=navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}));if(allowed){await navigator.share(shareData);return}}catch(e){if(e?.name==='AbortError')return}download(blob,name);const text='Games Planet Invoice '+$('invoiceNo').value+' downloaded. Please attach the downloaded '+name+' in WhatsApp.';window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');alert('File download ho gayi hai. WhatsApp me downloaded file attach karein.')}
async function withBusy(button,task){const old=button.textContent;button.disabled=true;button.textContent='Please wait…';try{await task()}catch(e){console.error(e);alert(e?.message||'File banate waqt error aaya.')}finally{button.disabled=false;button.textContent=old}}
$('printBtn').onclick=()=>{render();window.print()};$('pdfBtn').onclick=()=>withBusy($('pdfBtn'),async()=>download(await pdfBlob(),filename('pdf')));$('jpgBtn').onclick=()=>withBusy($('jpgBtn'),async()=>download(await jpegBlob(),filename('jpg')));$('waPdfBtn').onclick=()=>withBusy($('waPdfBtn'),async()=>shareFile(await pdfBlob(),filename('pdf'),'application/pdf'));$('waJpgBtn').onclick=()=>withBusy($('waJpgBtn'),async()=>shareFile(await jpegBlob(),filename('jpg'),'image/jpeg'));init();
</script>
</body>
</html>
