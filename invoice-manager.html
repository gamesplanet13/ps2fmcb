<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games Planet Custom Invoice Manager</title>
<style>
:root{--ink:#101820;--blue:#0a66c2;--line:#25313d;--soft:#eef3f7;--green:#11864b}*{box-sizing:border-box}body{margin:0;background:#e9eef3;color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif}.shell{max-width:1400px;margin:auto;padding:14px}.head,.toolbar,.card{background:#fff;border-radius:14px;box-shadow:0 7px 24px #1232  }.head{padding:14px 18px;display:flex;gap:12px;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:clamp(22px,4vw,34px)}a.btn,button{border:0;border-radius:8px;padding:9px 12px;background:#dfe8f1;color:#102234;font-weight:750;text-decoration:none;cursor:pointer}.primary{background:var(--blue)!important;color:#fff!important}.wa{background:#16a05d!important;color:#fff!important}.danger{background:#b42318!important;color:#fff!important}.grid{display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;margin-top:14px}.card{padding:14px}.card h2{margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:7px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:8px;border:1px solid #b9c5d0;border-radius:7px;font:inherit}.field textarea{min-height:55px}.line-editor{overflow:auto;border:1px solid #ccd5de;border-radius:8px}.line-editor table{min-width:760px}.line-editor input{width:100%;min-width:70px;border:1px solid #ccd5de;border-radius:5px;padding:6px}.line-editor .product{min-width:190px}.toolbar{margin-top:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap}.preview-wrap{min-width:0}.invoice{background:#fff;margin:auto;padding:10mm;min-height:270mm;width:210mm;max-width:100%;box-shadow:0 8px 30px #1232}.invoice.a5{width:148mm;min-height:200mm;padding:7mm}.invoice.receipt{width:58mm;min-height:auto;padding:3mm;font-size:8px}.bill-head{display:grid;grid-template-columns:1fr auto;border:2px solid var(--line);padding:10px;gap:10px}.bill-head h2{margin:0;font-family:Georgia,serif;font-size:28px}.bill-head .right{text-align:right}.bill-type{text-align:center;border:2px solid var(--line);border-top:0;padding:4px;font-weight:900;letter-spacing:1px}.buyer{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-top:0}.buyer>div{padding:8px}.buyer>div+div{border-left:1px solid var(--line)}table{border-collapse:collapse;width:100%}.bill-table th,.bill-table td{border:1px solid var(--line);padding:6px;vertical-align:top}.bill-table th{text-align:center;background:#f0f2f4}.num{text-align:right}.totals{margin-left:auto;width:min(100%,360px);border:2px solid var(--line);border-top:0}.totals div{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #8d98a2}.totals div:last-child{font-size:18px;font-weight:900;border:0}.foot{display:grid;grid-template-columns:1fr 180px;border:2px solid var(--line);border-top:0;min-height:70px}.foot>div{padding:8px}.sign{border-left:1px solid var(--line);display:flex;align-items:end;justify-content:center;font-weight:800}.receipt .bill-head{display:block}.receipt .bill-head h2{font-size:15px}.receipt .right{text-align:left}.receipt .buyer{display:block}.receipt .buyer>div+div{border:0;border-top:1px solid}.receipt .bill-table{font-size:7px}.receipt .bill-table th,.receipt .bill-table td{padding:2px}.receipt .hide58{display:none}.receipt .totals{width:100%}.receipt .foot{display:block}.receipt .sign{display:none}.records{margin-top:14px}.search-results{max-height:260px;overflow:auto}.result{padding:9px;border-bottom:1px solid #d6dee6;display:flex;justify-content:space-between;gap:8px}.report{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.metric{background:#eff5fb;border-radius:8px;padding:9px}.metric b{display:block;font-size:18px}.muted{color:#607080;font-size:12px}.status{position:fixed;right:12px;bottom:12px;background:#102234;color:white;padding:10px 14px;border-radius:9px;display:none;z-index:9}.status.show{display:block}@media(max-width:940px){.grid{grid-template-columns:1fr}.invoice{width:100%;min-height:0}.report{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shell{padding:7px}.row{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.report{grid-template-columns:1fr}.invoice{padding:8px}.bill-head{display:block}.bill-head .right{text-align:left}.buyer{display:block}.buyer>div+div{border-left:0;border-top:1px solid}.bill-table{font-size:9px}.bill-table th,.bill-table td{padding:3px}.hide-mobile{display:none}.foot{grid-template-columns:1fr 100px}}@media print{body{background:#fff}.head,.editor,.toolbar,.records{display:none!important}.shell,.grid{display:block;padding:0;margin:0}.invoice{box-shadow:none;max-width:none}.preview-wrap{width:max-content;margin:auto}}
</style><style id="pageStyle">@page{size:A4;margin:8mm}</style>
</head>
<body><div class="status" id="status"></div><div class="shell">
<header class="head"><div><h1>Custom Invoice Manager</h1><div class="muted">Auto-save • Search • GST/non-GST records • Backup</div></div><div><a class="btn" href="invoice.html">Professional Invoice</a> <a class="btn" href="index.html">Products</a></div></header>
<div class="grid"><section class="card editor"><h2>Invoice Details</h2>
<div class="row"><div class="field"><label>Invoice Type</label><select id="type"><option value="cash">GST Excluded — Cash Bill</option><option value="gst">GST Included — Tax Invoice (18%)</option></select></div><div class="field"><label>Layout</label><select id="layout"><option value="a4">A4 Full</option><option value="a5">A5 / A4 Half</option><option value="58">58mm Thermal</option></select></div></div>
<div class="row"><div class="field"><label>Invoice Number</label><input id="invoiceNo"></div><div class="field"><label>Date</label><input id="date" type="date"></div></div>
<div class="row"><div class="field"><label>Customer Name</label><input id="customer"></div><div class="field"><label>Mobile</label><input id="mobile"></div></div><div class="field"><label>Address</label><textarea id="address"></textarea></div>
<div class="line-editor"><table><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Weight g</th><th>Size cm</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
<div style="margin-top:8px"><button id="addLine">+ Add Product</button> <button id="importCart">Import Current Cart</button></div>
<div class="row"><div class="field"><label>Courier</label><input id="courier" type="number" min="0" value="0"></div><div class="field"><label>Price Adjustment</label><input id="adjustment" type="number" min="0" value="0"></div></div><div class="field"><label>Note</label><textarea id="note">Goods once sold cannot be taken back or exchanged.</textarea></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="newBtn">New Invoice</button><button class="primary" id="saveBtn">Save Invoice</button></div></section>
<section class="preview-wrap"><main class="invoice" id="paper"><div id="preview"></div></main><div class="toolbar"><button id="printBtn">Print</button><button id="pdfBtn">Download PDF</button><button id="jpgBtn">Download JPEG</button><button class="wa" id="waPdfBtn">WhatsApp PDF</button><button class="wa" id="waJpgBtn">WhatsApp JPEG</button></div></section></div>
<section class="card records"><h2>Saved Invoices &amp; Sales</h2><div class="row"><div class="field"><label>Search invoice, name or product</label><input id="search"></div><div class="field"><label>Actions</label><div><button id="backupBtn">Export Backup</button> <button id="restoreBtn">Restore Backup</button><input id="restoreFile" type="file" accept="application/json" hidden></div></div></div><div class="search-results" id="results"></div>
<div class="row"><div class="field"><label>From Date</label><input id="from" type="date"></div><div class="field"><label>To Date</label><input id="to" type="date"></div></div><button id="reportBtn">Refresh Report</button> <button id="excelBtn">Export Excel</button><div class="report" id="report"></div></section>
</div><script src="assets/html2canvas.min.js"></script><script src="assets/jspdf.umd.min.js"></script><script>
const $=id=>document.getElementById(id), DB='gamesPlanetInvoiceDB', VER=1;let db, timer, lineId=0;
const seller={name:'GAMES PLANET',trade:'M/S GAMES PLANET ZONE',legal:'RAJINDER SINGH',gstin:'09DIDPS5066Q1ZB',mobile:'7983624797',address:"Shop No. 12, Water Works Compound, Radha Road, Civil Lines, Rampur, Uttar Pradesh – 244901"};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('invoices'))d.createObjectStore('invoices',{keyPath:'invoiceNo'});if(!d.objectStoreNames.contains('drafts'))d.createObjectStore('drafts',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(name){return req(store(name).getAll())}function put(name,v){return req(store(name,'readwrite').put(v))}
function toast(s){$('status').textContent=s;$('status').classList.add('show');setTimeout(()=>$('status').classList.remove('show'),2200)}
function addLine(v={}){const id=++lineId,tr=document.createElement('tr');tr.dataset.id=id;tr.innerHTML=`<td><input class="product" value="${esc(v.name||'')}"></td><td><input class="qty" type="number" min="1" value="${Number(v.qty||v.quantity||1)}"></td><td><input class="rate" type="number" min="0" value="${Number(v.rate??v.unitPrice??0)}"></td><td><input class="weight" type="number" min="0" value="${Number(v.weight??v.unitWeight??0)}"></td><td><input class="size" value="${esc(v.size||(Array.isArray(v.dimensions)?v.dimensions.join(' × '):''))}"></td><td><button class="danger remove">×</button></td>`;tr.querySelector('.remove').onclick=()=>{tr.remove();changed()};tr.querySelectorAll('input').forEach(x=>x.oninput=changed);$('lines').appendChild(tr)}
function getLines(){return [...$('lines').rows].map(r=>({name:r.querySelector('.product').value.trim(),qty:Math.max(1,+r.querySelector('.qty').value||1),rate:Math.max(0,+r.querySelector('.rate').value||0),weight:Math.max(0,+r.querySelector('.weight').value||0),size:r.querySelector('.size').value.trim()})).filter(x=>x.name)}
function data(){return{invoiceNo:$('invoiceNo').value.trim(),date:$('date').value,type:$('type').value,customer:$('customer').value.trim(),mobile:$('mobile').value.trim(),address:$('address').value.trim(),layout:$('layout').value,lines:getLines(),courier:Math.max(0,+$('courier').value||0),adjustment:Math.max(0,+$('adjustment').value||0),note:$('note').value,updatedAt:new Date().toISOString()}}
function totals(d=data()){const gross=d.lines.reduce((s,x)=>s+x.qty*x.rate,0),adjust=Math.min(gross,d.adjustment),after=gross-adjust+d.courier,taxable=d.type==='gst'?after/1.18:after,gst=d.type==='gst'?after-taxable:0;return{gross,adjust,taxable,gst,total:after,qty:d.lines.reduce((s,x)=>s+x.qty,0),weight:d.lines.reduce((s,x)=>s+x.qty*x.weight,0)}}
function render(){const d=data(),t=totals(d),gst=d.type==='gst',p=$('paper');p.className='invoice '+(d.layout==='a5'?'a5':d.layout==='58'?'receipt':'');$('pageStyle').textContent=d.layout==='58'?'@page{size:58mm auto;margin:0}':'@page{size:A4 portrait;margin:8mm}';const rows=d.lines.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b><div class="muted">${x.size?'Size: '+esc(x.size)+' cm · ':''}${x.weight?'Weight: '+x.weight+' g':''}</div></td><td class="num">${x.qty}</td><td class="num">${money(x.rate)}</td><td class="num">${money(x.qty*x.rate)}</td></tr>`).join('')||'<tr><td colspan="5" style="height:140px"></td></tr>';$('preview').innerHTML=`<div class="bill-head"><div><h2>${gst?seller.trade:seller.name}</h2><div>${gst?'Legal Name: '+seller.legal+'<br>GSTIN: '+seller.gstin+'<br>':''}${seller.address}<br>Mob: ${seller.mobile}</div></div><div class="right"><b>${gst?'TAX INVOICE':'CASH BILL'}</b><br>No: ${esc(d.invoiceNo)}<br>Date: ${esc(d.date)}</div></div><div class="bill-type">${gst?'GST INCLUDED (18%)':'GST EXCLUDED'}</div><div class="buyer"><div><b>M/s:</b> ${esc(d.customer||'Customer')}<br><b>Address:</b> ${esc(d.address)}</div><div><b>Mobile:</b> ${esc(d.mobile)}<br><b>Total Qty:</b> ${t.qty} &nbsp; <b>Weight:</b> ${t.weight} g</div></div><table class="bill-table"><thead><tr><th>S.No.</th><th>PARTICULARS</th><th>Qty.</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><div><span>Products</span><b>${money(t.gross)}</b></div>${t.adjust?`<div><span>Price Adjustment</span><b>− ${money(t.adjust)}</b></div>`:''}${d.courier?`<div><span>Courier</span><b>${money(d.courier)}</b></div>`:''}${gst?`<div><span>Taxable Value</span><b>${money(t.taxable)}</b></div><div><span>GST Included (18%)</span><b>${money(t.gst)}</b></div>`:''}<div><span>Total Amount</span><span>${money(t.total)}</span></div></div><div class="foot"><div><b>Note:</b><br>${esc(d.note)}</div><div class="sign">Authorised Signature</div></div>`}
function changed(){render();clearTimeout(timer);timer=setTimeout(()=>put('drafts',{id:'current',data:data()}).catch(()=>{}),500)}
async function nextNo(){const type=$('type').value,key='serial-'+type+'-'+new Date().getFullYear(),m=await req(store('meta').get(key))||{key,value:0};m.value++;await put('meta',m);return `GPZ-${type==='gst'?'GST':'CASH'}-${new Date().getFullYear()}-${String(m.value).padStart(4,'0')}`}
async function fresh(){$('invoiceNo').value=await nextNo();$('date').value=new Date().toISOString().slice(0,10);$('customer').value=$('mobile').value=$('address').value='';$('courier').value=$('adjustment').value=0;$('lines').innerHTML='';addLine();changed()}
function load(d){['invoiceNo','date','type','customer','mobile','address','layout','courier','adjustment','note'].forEach(k=>$(k).value=d[k]??'');$('lines').innerHTML='';(d.lines||[]).forEach(addLine);if(!d.lines?.length)addLine();render();scrollTo({top:0,behavior:'smooth'})}
async function save(){const d=data();if(!d.invoiceNo||!d.lines.length)return alert('Invoice number aur product zaroori hai.');d.savedAt=new Date().toISOString();await put('invoices',d);await search();await report();toast('Invoice saved')}
async function search(){const q=$('search').value.toLowerCase(),list=(await all('invoices')).filter(x=>!q||x.invoiceNo.toLowerCase().includes(q)||(x.customer||'').toLowerCase().includes(q)||(x.lines||[]).some(y=>y.name.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$('results').innerHTML=list.map(x=>`<div class="result"><div><b>${esc(x.invoiceNo)}</b> — ${esc(x.customer||'Customer')}<br><span class="muted">${x.date} · ${x.type==='gst'?'GST':'Non-GST'} · ${money(totals(x).total)} · ${(x.lines||[]).map(y=>esc(y.name)).join(', ')}</span></div><button data-load="${esc(x.invoiceNo)}">Load</button></div>`).join('')||'<div class="muted">No saved invoice found.</div>';$('results').querySelectorAll('[data-load]').forEach(b=>b.onclick=async()=>load(await req(store('invoices').get(b.dataset.load))))}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function backup(){const obj={version:1,exportedAt:new Date().toISOString(),invoices:await all('invoices'),meta:await all('meta')};download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),'games-planet-invoice-backup.json')}
async function restore(file){const x=JSON.parse(await file.text());for(const i of x.invoices||[])await put('invoices',i);for(const m of x.meta||[])await put('meta',m);await search();await report();toast('Backup restored')}
function inRange(x){return (!$('from').value||x.date>=$('from').value)&&(!$('to').value||x.date<=$('to').value)}async function report(){const list=(await all('invoices')).filter(inRange),gst=list.filter(x=>x.type==='gst'),cash=list.filter(x=>x.type!=='gst'),sum=a=>a.reduce((s,x)=>s+totals(x).total,0),tax=gst.reduce((s,x)=>s+totals(x).gst,0);$('report').innerHTML=`<div class="metric">GST Sales<b>${money(sum(gst))}</b>${gst.length} invoices</div><div class="metric">Non-GST Sales<b>${money(sum(cash))}</b>${cash.length} invoices</div><div class="metric">GST Included<b>${money(tax)}</b></div><div class="metric">Total Sales<b>${money(sum(list))}</b>${list.length} invoices</div>`;return list}
async function excel(){const list=await report(),rows=list.map(x=>{const t=totals(x);return `<Row><Cell><Data ss:Type="String">${esc(x.invoiceNo)}</Data></Cell><Cell><Data ss:Type="String">${esc(x.date)}</Data></Cell><Cell><Data ss:Type="String">${esc(x.customer)}</Data></Cell><Cell><Data ss:Type="String">${x.type==='gst'?'GST':'Non-GST'}</Data></Cell><Cell><Data ss:Type="String">${esc(x.lines.map(y=>y.name+' x'+y.qty).join(' + '))}</Data></Cell><Cell><Data ss:Type="Number">${t.taxable}</Data></Cell><Cell><Data ss:Type="Number">${t.gst}</Data></Cell><Cell><Data ss:Type="Number">${t.total}</Data></Cell></Row>`}).join(''),xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Sales"><Table><Row>${['Invoice','Date','Customer','Type','Products','Taxable','GST','Total'].map(h=>`<Cell><Data ss:Type="String">${h}</Data></Cell>`).join('')}</Row>${rows}</Table></Worksheet></Workbook>`;download(new Blob([xml],{type:'application/vnd.ms-excel'}),'games-planet-sales.xls')}
async function canvas(){if(typeof html2canvas!=='function')throw Error('PDF/JPEG library load nahi hui.');return html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false})}async function jpg(){const c=await canvas();return new Promise((ok,no)=>c.toBlob(b=>b?.size?ok(b):no(Error('JPEG create nahi hui')),'image/jpeg',.95))}async function pdf(){if(!window.jspdf?.jsPDF)throw Error('PDF library load nahi hui.');const c=await canvas(),{jsPDF}=window.jspdf,img=c.toDataURL('image/jpeg',.94),receipt=$('layout').value==='58',w=receipt?58:210,h=receipt?Math.max(40,58*c.height/c.width):297,p=new jsPDF({unit:'mm',format:[w,h],orientation:'p',compress:true}),ratio=Math.min(w/c.width,h/c.height);p.addImage(img,'JPEG',0,0,c.width*ratio,c.height*ratio,undefined,'FAST');return p.output('blob')}
async function share(blob,name,type){const f=new File([blob],name,{type});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'Games Planet Invoice',files:[f]});return}}catch(e){if(e.name==='AbortError')return}download(blob,name);window.open('https://wa.me/?text='+encodeURIComponent('Games Planet invoice downloaded. Please attach '+name+' in WhatsApp.'),'_blank');alert('PDF/JPEG download ho gayi. WhatsApp me downloaded file attach karein.')}
async function run(fn){try{await fn()}catch(e){console.error(e);alert(e.message||'Error')}}
async function init(){await openDB();$('date').value=new Date().toISOString().slice(0,10);const draft=await req(store('drafts').get('current'));if(draft?.data)load(draft.data);else await fresh();document.querySelectorAll('.editor input,.editor textarea,.editor select').forEach(x=>{if(!['search'].includes(x.id))x.addEventListener(x.tagName==='SELECT'?'change':'input',changed)});$('addLine').onclick=()=>{addLine();changed()};$('importCart').onclick=()=>{let o;try{o=JSON.parse(localStorage.getItem('gp_invoice_summary')||localStorage.getItem('gp_order_summary')||'null')}catch{};if(!o?.items?.length)return alert('Current cart empty hai.');$('lines').innerHTML='';o.items.forEach(x=>addLine({name:x.name,qty:x.quantity,rate:x.unitPrice,weight:x.unitWeight,dimensions:x.dimensions}));changed()};$('newBtn').onclick=fresh;$('saveBtn').onclick=save;$('search').oninput=search;$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>e.target.files[0]&&run(()=>restore(e.target.files[0]));$('reportBtn').onclick=report;$('excelBtn').onclick=excel;$('from').onchange=$('to').onchange=report;$('printBtn').onclick=()=>{render();print()};$('pdfBtn').onclick=()=>run(async()=>download(await pdf(),$('invoiceNo').value+'.pdf'));$('jpgBtn').onclick=()=>run(async()=>download(await jpg(),$('invoiceNo').value+'.jpg'));$('waPdfBtn').onclick=()=>run(async()=>share(await pdf(),$('invoiceNo').value+'.pdf','application/pdf'));$('waJpgBtn').onclick=()=>run(async()=>share(await jpg(),$('invoiceNo').value+'.jpg','image/jpeg'));await search();await report();render()};init().catch(e=>alert('Invoice database open nahi hua: '+e.message));
</script></body></html>
