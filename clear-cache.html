<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Games Planet — Updating</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071226;color:#fff;font-family:system-ui,sans-serif;text-align:center}
    main{padding:28px}.spinner{width:44px;height:44px;margin:0 auto 18px;border:5px solid #294365;border-top-color:#28d17c;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main><div class="spinner"></div><h2>Updating Games Planet…</h2><p>पुराना cache हटाया जा रहा है।</p></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.map(name=>caches.delete(name)));
    }
  }finally{
    location.replace('./index.html?update=20260921-2');
  }
})();
</script>
</body>
</html>
